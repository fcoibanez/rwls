[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rwls"
version = "0.0.1"
description = "Regime-weighted least squares: regime-dependent factor models estimated with hidden Markov posterior probabilities."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Francisco Ibanez" }]
keywords = ["financial econometrics", "factor models", "regime switching", "hidden Markov model", "weighted least squares"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "hmmlearn>=0.3",
    "scikit-learn>=1.2",
    "joblib>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.urls]
Source = "https://github.com/fcoibanez/rwls"

[tool.hatch.build.targets.wheel]
packages = ["src/rwls"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: downloads data from the internet (deselect with -m 'not network')",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
